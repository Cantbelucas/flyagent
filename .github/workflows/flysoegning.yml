name: Flysoegning

# Koerer to gange om dagen paa GitHubs servere. Din egen computer maa gerne
# vaere slukket. Tiderne er UTC: 06:00 og 16:00 UTC svarer til 07:00 og 17:00
# dansk tid om vinteren, 08:00 og 18:00 om sommeren.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      altid_besked:
        description: "Send besked selvom prisen ikke er faldet"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: flysoegning
  cancel-in-progress: false

jobs:
  soeg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Saet Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright og browseren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Soeg efter fly
        run: python soeg.py --stille

      - name: Gem rapporten i repoet
        run: |
          git config user.name "Flyagent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultater
          if git diff --staged --quiet; then
            echo "Priserne er uaendrede - intet at gemme."
          else
            git commit -m "Flysoegning $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Send besked ved prisfald
        env:
          GH_TOKEN: ${{ github.token }}
          ALTID_BESKED: ${{ inputs.altid_besked && '1' || '0' }}
        run: python ci_besked.py

      - name: Gem rapporten som download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejseplan
          path: resultater/
          retention-days: 30
